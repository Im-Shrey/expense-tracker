<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% extends "base.html" %}
    <title>{% block title %}Edit Expense{% endblock %}</title>
</head>

<body>

    {% block content %}
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">Edit Expense</h3>

                        <a href="{{ url_for('view_expenses') }}"
                        class="btn-close"
                        aria-label="Cancel editing">
                        </a>
                    </div>

                    <div class="card-body">

                        {% if errors %}
                            <div class="alert alert-danger">
                                <ul class="mb-0">
                                    {% for error in errors %}
                                        <li>{{ error }}</li>
                                    {% endfor %}
                                </ul>
                            </div>
                        {% endif %}

                        <form method="POST">

                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="description"
                                    name="description"
                                    value="{{ form_data.description if form_data else expense['description'] }}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label">
                                    Amount
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="amount"
                                    name="amount"
                                    step="0.01"
                                    min="0.01"
                                    value="{{ form_data.amount if form_data else expense['amount'] }}"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="category" class="form-label">
                                    Category
                                </label>

                                <select
                                    class="form-select"
                                    id="category"
                                    name="category"
                                    required
                                >
                                    {% for item in ["Food", "Transport", "Education", "Shopping", "Entertainment"] %}
                                        <option
                                            value="{{ item }}"
                                            {% if (form_data.category if form_data else expense['category']) == item %}
                                                selected
                                            {% endif %}
                                        >
                                            {{ item }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Save Changes
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    {% endblock %}

</body>
</html>
